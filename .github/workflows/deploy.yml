name: Export, encrypt, and deploy
on:
    push:
        branches:
            - gh-pages
jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
          contents: write
          pages: write
        steps:
            - uses: actions/checkout@v3
            - name: Install staticrypt
              run: npm install -g staticrypt@3.*
            - name: Encrypt with Staticrypt
              run: >
                staticrypt index.html -p ${{ secrets.SITEPW }} --short --template-title "Login To Our Wedding Site" --template-instructions "Enter the password from your invitation" --template-button "Enter"
            - name: Clean up
              run: |
                mv encrypted/index.html index.html
                rm -r encrypted