name: Export, encrypt, and deploy
on:
    push:
        branches:
            - gh-pages
jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
          contents: write
          pages: write
        steps:
            - name: Install Git
              run: |
                sudo apt-get clean && sudo apt-get update -y
                sudo apt-get install -y git
                git config --global --add safe.directory "$GITHUB_WORKSPACE"
            - uses: actions/checkout@v3
            - name: Install staticrypt
              run: npm install -g staticrypt@latest
            - name: Encrypt with Staticrypt
              run: >
                staticrypt index.html -p ${{ secrets.SITEPW }} --short --template-title "Login To Our Wedding Site" --template-instructions "Enter the password from your invitation" --template-button "Open Page" --template-color-secondary "#E2D6C7" --template-color-primary "#0086E1"
            - name: Clean up
              run: |
                mv encrypted/index.html index.html
                rm -r encrypted
            - name: Commit files
              run: |
                git config user.name github-actions
                git config user.email github-actions@github.com
                git add .
                git commit -m "encrypted files"
            - name: Push changes
              uses: ad-m/github-push-action@master
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                branch: gh-pages
                force: true