name: Export, encrypt, and deploy
on:
    push:
        branches:
            - gh-pages
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Install staticrypt
              run: npm install -g staticrypt@3.*
            - name: Encrypt with Staticrypt
              run: >
                staticrypt * -r -d . -p ${{ secrets.SITEPW }} --short
                --template-title "Login To Our Wedding Site" \
                --template-instructions "Enter the password from your invitation" \